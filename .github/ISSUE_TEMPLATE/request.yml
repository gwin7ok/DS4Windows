name: "[Enhancement / 要望] 機能の要望・改善の提案"
description: "Suggest a feature or an improvement / こんな機能が欲しい、ここを直してほしい、という要望"
title: "[✨Enhancement / 要望] "
labels: ["✨Enhancement / 要望"]
body:
  - type: textarea
    id: what
    attributes:
      label: "Your request / 要望の内容"
      description: "Describe the feature or improvement you would like / どんな機能・改善が欲しいかを書いてください"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: "Problem or reason (optional) / 困っていること・理由（任意）"
      description: "Explain what problem you are facing and why this is needed to help us evaluate your request / 今どんなことで困っているか、なぜ必要かが分かると、検討しやすくなります"
