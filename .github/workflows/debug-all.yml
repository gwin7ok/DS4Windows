name: Debug ALL (build and test)

# .vscode/tasks.json の "Debug ALL"（Build Debug -> Build Test -> Execute Test）と同じ手順を Windows ランナーで実行する。
on:
  push:
    # 作業ブランチだけ。For-DI-migration-work への反映は、検証済みのコミットなので走らせない（手動実行は workflow_dispatch で可能）
    branches:
      - for-di-migration-work-hsoyim
  workflow_dispatch:

concurrency:
  group: debug-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-all:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build Debug
        shell: pwsh
        run: ./scripts/Build-Debug.ps1

      - name: Build Test (Actions)
        run: dotnet build ./DS4WindowsTests/DS4Windows.Actions.Tests.csproj -c Debug /p:platform=x64 --no-dependencies

      - name: Build Test (Standalone)
        run: dotnet build ./StandaloneTests/StandaloneTests.csproj -c Debug /p:platform=x64 --no-dependencies

      - name: Execute Test (Actions)
        run: dotnet test ./DS4WindowsTests/DS4Windows.Actions.Tests.csproj -c Debug /p:platform=x64 --no-build --blame-hang --blame-hang-timeout 15s -v normal --logger "trx;LogFileName=actions.trx" --results-directory ./TestResults

      - name: Execute Test (Standalone)
        run: dotnet test ./StandaloneTests/StandaloneTests.csproj -c Debug /p:platform=x64 --no-build --blame-hang --blame-hang-timeout 15s -v normal --logger "trx;LogFileName=standalone.trx" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
